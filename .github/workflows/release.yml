name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  setup:
    name: 'Setup Configuration'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      feature_automatic_changelog_and_release: ${{ steps.parse-config.outputs.feature_automatic_changelog_and_release }}
      feature_automatic_backporting: ${{ steps.parse-config.outputs.feature_automatic_backporting }}
      feature_automatic_rc_releases: ${{ steps.parse-config.outputs.feature_automatic_rc_releases }}
      backport_branches: ${{ steps.parse-config.outputs.backport_branches }}
      rc_release_branches: ${{ steps.parse-config.outputs.rc_release_branches }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse Configuration
        id: parse-config
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/parse-config.sh .github/repo-config.yml

  release-please:
    name: 'Release Please'
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.release-please.outputs.version || steps.release-please.outputs['.--version'] }}
      release_created: ${{ steps.release-please.outputs.release_created || steps.release-please.outputs['.--release_created'] }}
      body: ${{ steps.release-please.outputs.body || steps.release-please.outputs['.--body'] }}
    steps:
      - name: Graceful Passing Check
        if: ${{ needs.setup.outputs.feature_automatic_changelog_and_release != 'true' }}
        run: |
          echo "Automatic changelog and release feature is disabled in .github/repo-config.yml. Passing gracefully."
          exit 0

      - name: Checkout Repository
        id: checkout-repository
        if: ${{ needs.setup.outputs.feature_automatic_changelog_and_release == 'true' }}
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release Please
        id: release-please
        if: ${{ needs.setup.outputs.feature_automatic_changelog_and_release == 'true' }}
        # https://github.com/googleapis/release-please-action/releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          release-type: simple
          skip-github-release: true

      - name: Verify Release Please Action
        id: verify-release-please
        if: ${{ needs.setup.outputs.feature_automatic_changelog_and_release == 'true' }}
        env:
          RELEASE_CREATED: ${{ steps.release-please.outputs.release_created || steps.release-please.outputs['.--release_created'] }}
          PR: ${{ steps.release-please.outputs.pr || steps.release-please.outputs['.--pr'] }}
        run: |
          if [[ "${RELEASE_CREATED}" != "true" && -z "${PR}" ]]; then
            echo "Error: Release Please did not create a release and did not create or update any pull request." >&2
            echo "This usually indicates that release-please aborted internally or encountered an issue (e.g. outstanding untagged merged PRs)." >&2
            exit 1
          fi
          echo "Release Please completed successfully (Release Created: ${RELEASE_CREATED}, PR: ${PR})"

  # These run after release-please generates a release
  release:
    name: 'Full Release'
    needs:
      - setup
      - release-please
    if: needs.setup.outputs.feature_automatic_changelog_and_release == 'true' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create Local Tag
        id: create-local-tag
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/create-local-tag.sh "${{ needs.release-please.outputs.version }}"
      - name: Setup Go
        id: setup-go
        if: ${{ hashFiles('go.mod') != '' }}
        # https://github.com/actions/setup-go/releases
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Retrieve GPG Credentials
        id: retrieve-gpg-credentials
        # https://github.com/rancher-eio/read-vault-secrets/commits
        uses: rancher-eio/read-vault-secrets@4c8f4e741954651c502bb7739c46ae1bad26b44d # @main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/signing/gpg passphrase | GPG_PASSPHRASE ;
            secret/data/github/repo/${{ github.repository }}/signing/gpg privateKeyId | GPG_KEY_ID ;
            secret/data/github/repo/${{ github.repository }}/signing/gpg privateKey | GPG_KEY
      - name: Save Release Notes
        id: save-release-notes
        env:
          RELEASE_BODY: ${{ needs.release-please.outputs.body }}
        run: |
          printf "%s\n" "$RELEASE_BODY" > /tmp/release-notes.md
      - name: Run GoReleaser
        id: run-goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ env.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          GPG_KEY: ${{ env.GPG_KEY }}
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/goreleaser.sh
      - name: Publish Release
        id: publish-release
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/publish-release.js`;
            const { default: script } = await import(scriptPath);
            await script({github, context, core, process});
